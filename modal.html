<dialog
    id="confirmationModal"
    aria-labelledby="confirmationTitle"
>

    <h2 id="confirmationTitle">
        Confirmation
    </h2>

    <p>
        Are you sure you want to continue?
    </p>

    <form method="dialog">

        <button type="submit">
            Cancel
        </button>

        <button type="submit">
            Confirm
        </button>

    </form>

</dialog>

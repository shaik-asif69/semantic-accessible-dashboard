<form action="#" method="post">

    <fieldset>

        <legend>User Information</legend>

        <label for="component-name">
            Full Name
        </label>

        <input
            type="text"
            id="component-name"
            name="name"
            required
            minlength="3"
            aria-label="Full Name"
        >

        <br><br>

        <label for="component-email">
            Email Address
        </label>

        <input
            type="email"
            id="component-email"
            name="email"
            required
            aria-label="Email Address"
        >

        <br><br>

        <button type="submit">
            Submit
        </button>

    </fieldset>

</form>
